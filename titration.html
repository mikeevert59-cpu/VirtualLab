<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Bürette Animation</title>

  <style>
    body {
      display: flex;
      justify-content: center;
      margin-top: 40px;
      background: #f5f5f5;
    }

    /* Flüssigkeit */
    .liquid {
      fill: #4da6ff;
      z-index: -1;
    }

    /* Animation */
    @keyframes fillBurette {
      from { height: 0; }
      to { height: 260px; }
    }

    @keyframes flowTube {
      from { stroke-dashoffset: 100; }
      to { stroke-dashoffset: 0; }
    }

    @keyframes drop {
      0% { transform: translateY(0); opacity: 1; }
      100% { transform: translateY(80px); opacity: 0; }
    }

    .drop {
      fill: #4da6ff;
      animation: drop 1s linear infinite;
    }

    button {
      position: absolute;
      top: 20px;
    }

    .scene {
      position: relative;
      width: 200px;
    }

    .bg {
      width: 100%;
      display: block;
    }

    .overlay {
      position: absolute;
      top: 45px;
      left: 720px;
      pointer-events: none;
    }
  </style>
</head>

<body>

<button onclick="startAnimation()">Start</button>

<img src="img/Titration.svg" class="">
<svg width="200" height="500" viewBox="0 0 200 500" class="overlay">

  <!-- Bürette Outline -->
  <rect x="80" y="20" width="20" height="300" fill="none" stroke="none"/>

  <!-- Flüssigkeit in Bürette -->
  <clipPath id="buretteClip">
    <rect x="80" y="20" width="20" height="300"/>
  </clipPath>

  <rect id="buretteLiquid" x="80" y="320" width="20" height="0"
        class="liquid" clip-path="url(#buretteClip)"/>

  <!-- Rohr d="M90 320 C90 350, 140 350, 140 380"-->
  <path id="tube"

        d="M0.5 0V27.5L15.5 36L58 46L102 57L126.5 63V80L128.5 81.5"
        stroke="#4da6ff"
        stroke-width="4"
        fill="none"
        stroke-dasharray="100"
        stroke-dashoffset="100"
  />

  <!-- Tropfen -->
  <circle id="drop" cx="140" cy="380" r="4" class="drop" style="display:none"/>

  <!-- Kolben -->
  <path d="M110 380 L170 480 L50 480 Z"
        fill="none" stroke="black"/>

  <!-- Flüssigkeit im Kolben -->
  <clipPath id="flaskClip">
    <path d="M110 380 L170 480 L50 480 Z"/>
  </clipPath>

  <rect id="flaskLiquid"
        x="50" y="480"
        width="120"
        height="0"
        class="liquid"
        clip-path="url(#flaskClip)"/>

</svg>

<script>
  function startAnimation() {

    const burette = document.getElementById("buretteLiquid");
    const tube = document.getElementById("tube");
    const drop = document.getElementById("drop");
    const flask = document.getElementById("flaskLiquid");

    let level = 0;
    let flaskLevel = 0;

    // Bürette füllen
    const fillInterval = setInterval(() => {
      if (level >= 260) {
        clearInterval(fillInterval);
        startFlow();
        return;
      }

      level += 2;
      burette.setAttribute("y", 320 - level);
      burette.setAttribute("height", level);

    }, 20);

    function startFlow() {
      tube.style.animation = "flowTube 2s linear forwards";
      drop.style.display = "block";

      // Kolben füllen
      const dripInterval = setInterval(() => {
        if (flaskLevel >= 80) {
          clearInterval(dripInterval);
          return;
        }

        flaskLevel += 1.5;
        flask.setAttribute("y", 480 - flaskLevel);
        flask.setAttribute("height", flaskLevel);

      }, 80);
    }
  }
</script>

</body>
</html>

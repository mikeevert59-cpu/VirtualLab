<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Pixel Perfect Bürette</title>

  <style>
    body {
      margin: 0;
      display: flex;
      justify-content: center;
      background: #eee;
    }

    .scene {
      position: relative;
      width: 371px;
      aspect-ratio: 371 / 1000; /* 🔥 verhindert JEGLICHEN Versatz */
    }

    /* Bild */
    .bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      z-index: 2;
    }

    /* SVG exakt deckungsgleich */
    .liquid-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Flüssigkeit */
    .liquid {
      fill: url(#grad);
    }
  </style>
</head>

<body>

<div class="scene">

  <!-- SVG -->
  <svg class="liquid-layer"
       viewBox="0 0 371 1000"
       preserveAspectRatio="none">

    <defs>

      <!-- realistischer Verlauf -->
      <linearGradient id="grad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#7fc8ff"/>
        <stop offset="100%" stop-color="#2f80ed"/>
      </linearGradient>

      <!-- 🧪 BÜRETTE (pixelgenau angepasst) -->
      <clipPath id="buretteClip">

        <path d="
        M176 18
        L195 18
        L195 330
        C195 345 210 355 210 375
        C210 395 195 405 185 405
        C175 405 160 395 160 375
        C160 355 176 345 176 330
        Z"/>
      </clipPath>

      <!-- 🧪 KOLBEN -->
      <clipPath id="flaskClip">
        <path d="
        M110 510
        L260 510
        L330 900
        C310 970 60 970 40 900
        Z"/>
      </clipPath>

    </defs>

    <!-- Bürette Flüssigkeit -->
    <rect id="buretteLiquid"
          x="160"
          y="400"
          width="60"
          height="0"
          class="liquid"
          clip-path="url(#buretteClip)"/>

    <!-- Kolben Flüssigkeit -->
    <rect id="flaskLiquid"
          x="40"
          y="950"
          width="290"
          height="0"
          class="liquid"
          clip-path="url(#flaskClip)"/>

  </svg>

  <!-- DEIN BILD -->
  <img src="titration.png" class="bg">

</div>

<script>

  // Referenzen
  const burette = document.getElementById("buretteLiquid");
  const flask = document.getElementById("flaskLiquid");

  let bLevel = 0;
  let fLevel = 0;

  // 🧪 Bürette füllen
  const fill = setInterval(() => {

    if (bLevel >= 380) {
      clearInterval(fill);
      drip();
      return;
    }

    bLevel += 2;

    burette.setAttribute("y", 400 - bLevel);
    burette.setAttribute("height", bLevel);

  }, 20);

  // 💧 Kolben füllen
  function drip() {
    const interval = setInterval(() => {

      if (fLevel >= 250) {
        clearInterval(interval);
        return;
      }

      fLevel += 1.5;

      flask.setAttribute("y", 950 - fLevel);
      flask.setAttribute("height", fLevel);

    }, 40);
  }

</script>

</body>
</html>

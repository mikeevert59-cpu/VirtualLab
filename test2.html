<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Titration Animation</title>

  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      margin-top: 40px;
      background: #f5f5f5;
      font-family: sans-serif;
    }

    .scene {
      position: relative;
      width: 260px;
    }

    .bg {
      width: 100%;
      display: block;
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    .liquid {
      fill: #4da6ff;
    }

    button {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 10;
    }

    /* Rohr Animation */
    @keyframes flow {
      to {
        stroke-dashoffset: 0;
      }
    }

    /* Tropfen */
    @keyframes dropFall {
      0% {
        transform: translateY(0);
        opacity: 1;
      }
      80% {
        opacity: 1;
      }
      100% {
        transform: translateY(70px);
        opacity: 0;
      }
    }

    .drop {
      fill: #4da6ff;
      opacity: 0;
    }

    #tube {
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
    }

  </style>
</head>

<body>

<div class="scene">

  <button onclick="startAnimation()">Start</button>

  <!-- Hintergrund -->
  <!--<img src="img/Titration.svg" class="bg">-->

  <!-- Overlay -->
  <svg viewBox="0 0 200 500"
       width="300"
       xmlns="http://www.w3.org/2000/svg"
       xmlns:xlink="http://www.w3.org/1999/xlink">

    <image xlink:href="img/Titration.svg"
           x="0"
           y="0"
           width="100%"
           height="100%"
           preserveAspectRatio="xMidYMid meet" />

    <!-- Bürette -->
    <clipPath id="buretteClip">
      <rect x="90" y="" width="20" height="260"/>
    </clipPath>

    <rect id="buretteLiquid"
    x="90"
    y="0"
          width="20"
          height="0"
          class="liquid"
          clip-path="url(#buretteClip)" />

    <!-- Rohr -->
    <path id="tube"
          d="M100 300 C100 340, 140 340, 140 380"
          stroke="#4da6ff"
          stroke-width="4"
          fill="none"/>

    <!-- Tropfen -->
    <circle id="drop" cx="140" cy="380" r="4" class="drop"/>

    <!-- Kolben -->
    <clipPath id="flaskClip">
      <path d="M110 380 L170 480 L50 480 Z"/>
    </clipPath>

    <rect id="flaskLiquid"
          x="50"
          y="480"
          width="120"
          height="0"
          class="liquid"
          clip-path="url(#flaskClip)" />

  </svg>
</div>

<script>

  let running = false;

  function startAnimation() {
    if (running) return;
    running = true;

    const burette = document.getElementById("buretteLiquid");
    const tube = document.getElementById("tube");
    const drop = document.getElementById("drop");
    const flask = document.getElementById("flaskLiquid");

    let level = 0;
    let flaskLevel = 0;

    /* -------------------------
       Rohr vorbereiten
    -------------------------*/
    const length = tube.getTotalLength();

    tube.style.visibility = "visible";   // 👈 WICHTIG
    tube.style.strokeDasharray = length;
    tube.style.strokeDashoffset = length;

// kleiner Trick für sauberen Start
    tube.getBoundingClientRect();

    tube.style.animation = "flow 1.5s linear forwards";

    /* -------------------------
       Bürette füllen (smooth)
    ------------------------- */
    function fillBurette() {
      if (level >= 260) {
        startFlow();
        return;
      }

      level += 1.5;
      burette.setAttribute("y", 300 - level);
      burette.setAttribute("height", level);

      requestAnimationFrame(fillBurette);
    }

    /* -------------------------
       Fluss starten
    ------------------------- */
    function startFlow() {
      tube.style.animation = "flow 1.5s linear forwards";
      dripLoop();
      fillFlask();
    }

    /* -------------------------
       Tropfen Loop (realistisch)
    ------------------------- */
    function dripLoop() {
      setInterval(() => {
        drop.style.opacity = 1;
        drop.style.animation = "dropFall 0.9s ease-in";

        setTimeout(() => {
          drop.style.animation = "none";
          drop.style.opacity = 0;
        }, 900);

      }, 900);
    }

    /* -------------------------
       Kolben füllen (mit easing)
    ------------------------- */
    function fillFlask() {
      if (flaskLevel >= 90) return;

      flaskLevel += 0.6;

      flask.setAttribute("y", 480 - flaskLevel);
      flask.setAttribute("height", flaskLevel);

      requestAnimationFrame(fillFlask);
    }

    fillBurette();
  }

</script>

</body>
</html>

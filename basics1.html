<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Title</title>
</head>
<style>
  body {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    margin-top: 40px;
    background: #f5f5f5;
    font-family: sans-serif;
  }

  #scene {
    position: relative;
    width: 260px;
  }


  text {
    font-size: 12px;
    font-family: sans-serif;
    text-anchor: middle;
  }

  .control {
    stroke: #337599;
    stroke-width: 1;
    stroke-dasharray: 1 1;
  }


  .liquid {
    fill: #4da6ff;

  }

  /* Rohr Animation */
  @keyframes flow {
    to {
      stroke-dashoffset: 0;
    }
  }

  @keyframes dropFall {
    0% {
      transform: translateY(0);
      opacity: 1;
    }
    100% {
      transform: translateY(70px);
      opacity: 0;
    }
  }

  .drop {
    fill: #4da6ff;
    opacity: 0;
  }

  #tube {
    stroke-dasharray: 1;
    stroke-dashoffset: 1;
  }
</style>
<body>
<div class="row" id="scene">
  <button onclick="startAnimation()">Start</button>
  <button onclick="stopAnimation()">Stop</button>
<div class="col">
<svg viewBox="0 0 600 600" width="600" height="600" class="vb" >
  <image xlink:href="img/Titration2.svg"/>

  <!--Testpfade
 <rect  x="105" y="40" width="20" height="200" fill="lightblue" opacity="0.5"/>
 <path d="M50,150 l100,-100 l100,100" class="control" />
  <path d="M150,250 q100,-100 200,0 t200,0 t200,0 t200,0" />
  <path d="M 10,250 l40,-80 l40,80 z" />
  <path d="M150,250 v-80 h80 v80 z" />
  <path d="M300,250 l-15,-50 l40,-30 l40,30 l-15,50 z" />
  <path d="M420,250 l-20,-40 l20,-40 h50 l20,40 l-20,40 z" />
-->

  <!-- Bürette -->
  <clipPath id="buretteClip">
    <rect x="107" y="5" width="20" height="260"/>
  </clipPath>

  <rect id="buretteLiquid"
        x = "107"
        y = "5"
        width="20"
        height="0"
        class="liquid"
        opacity="0.5"
        clip-path="url(#buretteClip)" />

  <!-- Rohr -->
  <svg   x = "116" y = "270">
  <path id="tube"
        d="M0.5 0V13.5L18 21L56.5 30L94.5 40L102.5 43V56.5"
        stroke="#4da6ff"
        stroke-width="4"
        fill="none"
        visibility="hidden"/>

  </svg>

  <!-- Tropfen -->
  <circle id="drop" cx="219" cy="420" r="4" class="drop"/>

  <!-- Kolben
  <clipPath id="flaskClip">
    <path d="M110 380 L170 480 L50 480 Z"/>
  </clipPath>-->

  <svg x="149" y = "510">
  <path id="flaskClip"
  d="M6.5 21.0031L13 1.50311L127 0.503113L130 9.00311L132 16.5031L135 25.0031L136.5 31.5031L135 37.0031L132 41.5031L126 45.0031L71.5
  46.5031H32H19.5L13 45.0031L6.5 40.0031L4.5 32.5031V28.0031L6.5 21.0031Z" stroke="" fill="red" shape-rendering="crispEdges"/>
  </svg>

  <!--
  <rect id="flaskLiquid"
        x="50"
        y="480"
        width="120"
        height="0"
        class="liquid"
        clip-path="url(#flaskClip)" />
       -->
<!--
  <marker id="circleMarker"
          markerUnits="userSpaceOnUse" markerWidth="6" markerHeight="6" refX="3" refY="3">
    <circle cx="3" cy="3" r="2" fill="hsl(201 50% 75%)" stroke="#337599" stroke-width=".5"
    /> </marker>-->
</svg>
</div>
<div class="col">
  <button onclick="buretteF()">Bürette füllen</button>

</div>
</div>
<script>

  let running = false;
  let dripping = false;

  function stopAnimation() {
    dripping = true;
    //running = false;
  }
  function startAnimation() {
    if (running) return;
    running = true;
    //dripping = false;

    const burette = document.getElementById("buretteLiquid");
    const tube = document.getElementById("tube");
    const drop = document.getElementById("drop");
    const flask = document.getElementById("flaskLiquid");

    let level = 0;
    let flaskLevel = 0;

    /* -------------------------
       Rohr vorbereiten
    -------------------------*/
    const length = tube.getTotalLength();

    tube.style.visibility = "visible";   // 👈 WICHTIG
    tube.style.strokeDasharray = length;
    tube.style.strokeDashoffset = length;

// kleiner Trick für sauberen Start
 //   tube.getBoundingClientRect();

    tube.style.animation = "flow 1.5s linear forwards";

    /* -------------------------
       Bürette füllen (smooth)
    ------------------------- */
    function fillBurette() {
      if (level >= 260) {
        startFlow();
        return;
      }

      level += 1.5;
      burette.setAttribute("y", 300 - level);
      burette.setAttribute("height", level);

      requestAnimationFrame(fillBurette);
    }

    /* -------------------------
       Fluss starten
    ------------------------- */
    function startFlow() {
      tube.style.animation = "flow 1.5s linear forwards";
      dripLoop();
      fillFlask();
    }

    /* -------------------------
       Tropfen Loop (realistisch)
    ------------------------- */
    function dripLoop() {

      setInterval(() => {
        if(dripping) {
          clearInterval(dripping);

        }
        // Tropfen zurücksetzen
        drop.style.animation = "none";
        drop.style.opacity = 0;

        // Reflow erzwingen (wichtig!)
        drop.getBoundingClientRect();

        // Animation starten
        drop.style.opacity = 1;
        drop.style.animation = "dropFall 0.6s linear";

      }, 600); // exakt gleiche Dauer wie Animation
    }

    /* -------------------------
       Kolben füllen (mit easing)
    ------------------------- */
    function fillFlask() {
      if (flaskLevel >= 90) return;

      flaskLevel += 0.6;

      flask.setAttribute("y", 480 - flaskLevel);
      flask.setAttribute("height", flaskLevel);

      requestAnimationFrame(fillFlask);
    }

    fillBurette();
  }

</script>
</body>
</html>

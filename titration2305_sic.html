<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Title</title>
  <link rel="stylesheet" href="titr_style.css">
  <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
</head>
<body>
<div class= "row" id="container">
  Säure-Base-Titrationen
</div>

<div class="row" id="scene">

  <div class="col" id="box1">
    <div class="sectionTitle"><span class="number">1.</span> Versuchsprotokoll</div>

    <div id="experimentPanel" class="paraPanel_on">
      <div class="panelTitle">
        Versuchsparameter <div id="experimentStatus"  class="statusReady" width="100px">🟡 Eingabe:</div>
      </div>
      <table class="expTable">
        <tr>
          <td>Säureauswahl</td>
          <td>
          <select id="acidSelect" style="width: 170px">
            <option selected>Auswählen</option>
            <option value="HCl">Salzsäure (HCl)</option>
            <option value="H2SO4">Schwefelsäure (H₂SO₄)</option>
            <option value="H3PO4">Phosphorsäure (H₃PO₄)</option>
            <option value="citricAcid">Zitronensäure</option>
          </select>
        </td></tr>
        <tr>
          <td>Probe</td>
          <td id="acidName"></td>
        </tr>
        <tr>
          <td>c<sub>Probe</sub></td>
          <td id="cProbe">?</td>
        </tr>
        <tr>
          <td>c<sub>NaOH</sub></td>
          <td>
            <select id="cNaOH" style="width: 100px" onSelect="updateNaOH()">
              <option selected>Auswählen</option>
              <option>0.05</option>
              <option>0.10</option>
              <option>0.20</option>
              <option>0.50</option>
              <option>1.00</option>
              <option>2.00</option>
            </select>
            mol/l
          </td>
        </tr>

        <tr>
          <td>V<sub>Probe</sub></td>
          <td>
            <select id="vProbe" style="width:100px">
              <option selected>Auswählen</option>
              <option>50</option>
              <option>100</option>
              <option>150</option>
              <option>200</option>
              <option>250</option>
              <option>500</option>
            </select>
            ml
          </td>
        </tr>
        <!--
        <tr >
          <td>Status</td>
          <td id="experimentStatus"  class="statusReady" width="150px">
            🟡 Eingabe
          </td>
        </tr>
        -->
        <tr >
          <td>Ihr Ergebnis</td>
          <td id="erg"  class="" width="150px">
            <input type="text" id="ergText" class="ergText" style="width: 100px"> mol/l
          </td>
        </tr>
      </table>
      <table id="dataTable2">
        <thead class="tableHead">
        <tr>
          <th>Aufgabe</th>
          <th>Versuch</th>
          <th>Säure</th>
          <th>cTitrant</th>
          <th>Vol. Probe</th>
        </tr>
        </thead>
        <tbody id="tableBody2">
        </tbody>
      </table>

      <button id="btnNewExperiment" class="resultDisabled" onclick="gesuchtKonz()">
        Ergebnis
      </button>

    </div>
  </div>


  <div class="setup"  style=""><div class="sectionTitle"><span class="number">2.</span>Versuchsdurchführung</div>
    <svg viewBox="-100 0 600 600" width="600" height="600" class="vb" >
      <image xlink:href="img/Titration2.svg"/>
      <g id="buretteScale" transform="translate(103,15)"></g>
      <!--Bürette-->
      <svg x="106" y="25" width="50" height="260">
        <!--<g id="buretteScale"></g>-->
        <!-- ClipPath -->
        <clipPath id="buretteClip">
          <rect x="0" y="0" width="25" height="260"/>
        </clipPath>

        <!-- Flüssigkeit (dein Path bleibt!) -->
        <path id="buretteLiquid"
              d="M0.5 236V0.5H21V236L19.5 240.5L15.5 246.5H6L2 240.5L0.5 236Z"
              class="liquid"
              visibility="hidden"
              clip-path="url(#buretteClip)"/>

      </svg>

      <!-- Rohr -->
      <svg   x = "116" y = "270">
        <path id="tube"
              d="M0.5 0V13.5L18 21L56.5 30L94.5 40L102.5 43V56.5"
              stroke="#4da6ff"
              stroke-width="4"
              fill="none"
              visibility="hidden"/>
      </svg>
      <!-- Tropfen -->
      <circle id="drop" cx="219" cy="420" r="4" class="drop"/>

      <svg x="153" y="485" >
        <defs>
          <mask id="flaskMask">

            <!-- schwarzer Hintergrund = unsichtbar -->
            <rect
              x="0"
              y="0"
              width="140"
              height="75"
              fill="black"/>

            <!-- weißer Bereich = sichtbar -->
            <rect
              id="flaskMaskLevel"
              x="0"
              y="71"
              width="140"
              height="0"
              fill="white"/>

          </mask>

          <filter id="blur">
            <feGaussianBlur stdDeviation="3"/>
          </filter>
        </defs>

        <!-- sichtbare Flüssigkeit (optional!)-->
        <path
          id="flaskLiquid"
          d="M9.5 25L17.5 0.5H115.5L122.5 25
       L132.5 53.5V59L130.5 64.5L125 68.5
       L117.5 71H9.5L5.5 68.5L3 64.5
       L0.5 59V53.5L9.5 25Z"
          fill="#b3d4fc"
          opacity="0.7"
          mask="url(#flaskMask)"
        />

        <!-- Schlieren-Layer -->
        <!--<g clip-path="url(#flaskLiquid)" id="mixLayer"></g>-->
        <g  mask="url(#flaskMask) "id="mixLayer"></g>
      </svg>
    </svg>

    <div id="digitalPanel" class="">
      <div class="lcdFrame">
        <div class="lcdLabel">
          Verbrauch/pH
        </div>
        <div id="lcdDisplay" class="lcdDisplay_on">
          <div id="displ1">0.00<span class="unit">mL</span></div>
          <div id="displ2">1.75<span class="unit">pH</span></div>
          <!--<div id="displ3"><marquee>Welcome to fun with chemistry!</marquee></div>-->
        </div>
        <div id="progressWrap">
          <div id="progressBar"></div>
        </div>
        <!--Drehregler-->
        <div id="knobPanel">

          <div class="moduleLabel">
            DOSING RATE
          </div>

          <svg id="knobSVG" width="140" height="140">

            <!-- Skala -->
            <circle
              cx="70"
              cy="70"
              r="54"
              class="knobScale"
            />

            <!-- Knopf -->
            <circle
              id="knob"
              cx="70"
              cy="70"
              r="42"
            />

            <!-- Markierung -->
            <line
              id="pointer"
              x1="70"
              y1="70"
              x2="70"
              y2="34"
            />
            <defs>

              <radialGradient id="knobGradient">

                <stop offset="0%" stop-color="#f5f5f5"/>
                <stop offset="100%" stop-color="#777"/>

              </radialGradient>

            </defs>
          </svg>

          <div id="speedReadout">
            0 ml/s
          </div>

        </div>
        <div id="touch">
          <svg id="touchPanel"
               x="360"
               y="40"
               width="220"
               height="70"
               viewBox="0 0 220 70">

            <!-- Hintergrund -->
            <rect x="0" y="0"
                  width="220"
                  height="70"
                  rx="15"
                  fill="#138a8a"/>
            <!-- Power -->
            <g id="btnPower" class="touchBtn" onclick="togglePower()">
              <circle cx="35" cy="35" r="20"/>
              <path d="M35 20 V35"
                    stroke="white"
                    stroke-width="3"
                    fill="none"
                     />
              <path d="M27 25
             A12 12 0 1 0 43 25"
                    stroke="white"
                    stroke-width="3"
                    fill="none"
              />
            </g>
            <!-- Run -->
            <g id="btnRun" class="touchBtn" onclick="toggleDrip()">
              <circle cx="90" cy="35" r="20"/>
              <polygon points="82,24 82,46 102,35"
                       fill="white"/>
            </g>
            <!-- Hold -->
            <g id="btnHold" class="touchBtn" onclick="toggleDrip()">
              <circle cx="145" cy="35" r="20"/>
              <rect x="136" y="26"
                    width="18"
                    height="18"
                    fill="#ff8c1a"/>
            </g>
            <!-- Reset -->
            <g id="btnReset" class="touchBtn1_off" onclick="resetTitrator2()">
              <circle cx="200" cy="35" r="20"/>
              <path
                d="M211 29
       A12 12 0 1 0 211 42"
                fill="none"
                stroke="white"
                stroke-width="3"
                stroke-linecap="round"/>
              <path
                d="M211 22
       L211 30
       L203 30"
                fill="none"
                stroke="white"
                stroke-width="3"
                stroke-linecap="round"
                stroke-linejoin="round"/>
            </g>

            <!-- Tropfen -->
            <!--
            <g id="btnDrop" class="touchBtn1" onclick="startAnimation()">
              <circle cx="200" cy="35" r="20"/>
              <path d="
      M200 18
      C190 30 188 36 188 42
      A12 12 0 0 0 212 42
      C212 36 210 30 200 18 Z"
                    fill="white"/>
            </g>-->
          </svg>
        </div>
      </div>
    </div>
  </div>

  <div class="panel"><div class="sectionTitle"><span class="number">3.</span>Versuchsauswertung</div>

   <!--<canvas id="curve" width="420" height="260" class="chartPanel"></canvas>-->
    <!-- Neu -->
    <div id="curve"></div>
    <table id="dataTable">
      <thead class="tableHead">
      <tr>
        <th>Volumen (ml)</th>
        <th>pH</th>
      </tr>
      </thead>

      <tbody id="tableBody">
      </tbody>
    </table>
    <!--<div id="werte"></div>-->
    <div id="ergebnis" style="visibility: hidden"></div>
  </div>
</div>
<!--<script src="titrator_refactored7.js" defer></script>-->
<script src="js_titr1609_kim3.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
</body>
</html>
